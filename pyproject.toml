[project]
name = "natal-calc-engine"
version = "0.1.0"
description = "Астрологические расчёты: натальная карта, синастрия, транзиты, SVG-колесо, геокодинг"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    # 6.x — мажорная версия с несовместимыми изменениями: другой движок
    # эфемерид, точки, орбы, имена узлов, стиль колеса; pyswisseph там
    # необязателен. Переход — отдельной миграцией со сравнением расчётов.
    "kerykeion>=5.12.10,<6",
    # Импортируется напрямую (app/chart.py), а не только через kerykeion.
    "pyswisseph>=2.10.3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "timezonefinder>=6.5",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
